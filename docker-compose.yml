version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: educonnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: educonnect
      POSTGRES_PASSWORD: educonnect_pass
      POSTGRES_DB: educonnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educonnect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - educonnect-network

  redis:
    image: redis:7-alpine
    container_name: educonnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - educonnect-network

networks:
  educonnect-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  postgres_data: